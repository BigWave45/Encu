          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${req_meta}', 1000000000000000000000000, 'agentguard-test.near', 'primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('${req_meta}', 'admin');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.record_outlayer_submission('${req_meta}', 'mock-provider-tx', 'mock-provider-request', 'awaiting_finality');" | jq -e '.status == "needs_review"' >/dev/null
