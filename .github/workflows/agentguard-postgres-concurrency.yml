# Exercises reservation, finality and recovery races on disposable PostgreSQL.
# Triggered by this workflow file so maintainers can rerun the isolated database suite on demand via a reviewed commit.
name: AgentGuard PostgreSQL concurrency test

on:
  push:
    branches:
      - agentguard/build-v1
    paths:
      - ".github/workflows/agentguard-postgres-concurrency.yml"
      - "supabase/setup.sql"
      - "supabase/20261101090000_atomic_outlayer_submission.sql"
      - "supabase/20261101120000_admin_dashboard_controls.sql"
      - "supabase/20261101140000_security_event_log.sql"
      - "supabase/20261101190000_agentguard_v1_security_controls.sql"
      - "supabase/20261101230000_submission_audit_and_append_only.sql"
      - "supabase/20261031221500_restrict_privileged_rpc_access.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservation-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agentguard_test_only
          POSTGRES_DB: agentguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: agentguard_test
      PGUSER: postgres
      PGPASSWORD: agentguard_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
      - name: Build disposable schema
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role LOGIN PASSWORD 'service_role_test_only';
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261031221500_restrict_privileged_rpc_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101090000_atomic_outlayer_submission.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101120000_admin_dashboard_controls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101140000_security_event_log.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101190000_agentguard_v1_security_controls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101230000_submission_audit_and_append_only.sql
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agentguard_transfers_enabled(true, 'primary');" | jq -e '.transfers_enabled == true' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.agents (id, name, active)
          VALUES ('research-agent', 'Research Agent', true);
          INSERT INTO public.agent_policies (agent_id)
          VALUES ('research-agent');
          SQL
          # Emergency stop must block both new reservations and pending approvals,
          # and both denials must create durable security events.
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-emergency-stop-pending',1000000000000000000000,'agentguard-test.near','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agentguard_transfers_enabled(false,'primary');" | jq -e '.transfers_enabled == false' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-emergency-stop-blocked',1000000000000000000000,'agentguard-test.near','primary');" | jq -e '.status == "blocked" and .reason == "emergency_stop"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('ag-emergency-stop-pending','primary');" | jq -e '.approved == false and .reason == "emergency_stop"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          DO $$
          DECLARE event_count integer; blocked_reservation_count integer;
          BEGIN
            SELECT count(*) INTO event_count FROM public.agentguard_security_events
              WHERE event_type IN ('transfer_emergency_stop_blocked','transfer_approval_blocked_emergency_stop');
            SELECT count(*) INTO blocked_reservation_count FROM public.spend_reservations
              WHERE request_id='ag-emergency-stop-blocked';
            IF event_count<>2 OR blocked_reservation_count<>0 THEN
              RAISE EXCEPTION 'emergency_stop_audit_mismatch: events=%, reservation=%',event_count,blocked_reservation_count;
            END IF;
          END
          $$
          SQL
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agentguard_transfers_enabled(true,'primary');" | jq -e '.transfers_enabled == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('ag-emergency-stop-pending','primary');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('ag-emergency-stop-pending','failed',NULL,'test_cleanup');" | jq -e '.status == "failed"' >/dev/null
          echo "PASS: emergency stop blocks reservations and approval submissions and audits both denials."
          # Exercise policy enforcement inside the reservation transaction.
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_policy('research-agent',2000000000000000000000000,NULL,NULL,ARRAY['agentguard-test.near']::text[],'primary');" | jq -e '.agent_id == "research-agent"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-policy-per-transfer',3000000000000000000000000,'agentguard-test.near','research-agent');" | jq -e '.reason == "agent_per_transfer_limit"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-policy-recipient',1000000000000000000000,'other.near','research-agent');" | jq -e '.reason == "recipient_not_allowed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_policy('research-agent',NULL,3000000000000000000000000,NULL,ARRAY['agentguard-test.near']::text[],'primary');" >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-policy-daily-a',2000000000000000000000000,'agentguard-test.near','research-agent');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-policy-daily-b',2000000000000000000000000,'agentguard-test.near','research-agent');" | jq -e '.reason == "agent_daily_limit"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reject_agent_transfer('ag-policy-daily-a','primary','test cleanup');" | jq -e '.status == "rejected"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_policy('research-agent',NULL,NULL,3000000000000000000000000,ARRAY['agentguard-test.near']::text[],'primary');" >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-policy-weekly-a',2000000000000000000000000,'agentguard-test.near','research-agent');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-policy-weekly-b',2000000000000000000000000,'agentguard-test.near','research-agent');" | jq -e '.reason == "agent_weekly_limit"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reject_agent_transfer('ag-policy-weekly-a','primary','test cleanup');" | jq -e '.status == "rejected"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_policy('research-agent',NULL,NULL,NULL,ARRAY[]::text[],'primary');" >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-policy-empty-allowlist',1000000000000000000000,'agentguard-test.near','research-agent');" | jq -e '.reason == "recipient_not_allowed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_policy('research-agent',NULL,NULL,NULL,NULL,'primary');" >/dev/null
          echo "PASS: per-transfer, daily, weekly, and empty-recipient policies are enforced atomically."

          # Persistent rate limits must serialize requests from independent clients.
          for i in $(seq 1 10); do
            psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.consume_agentguard_rate_limit('test:multi-instance','transfer_prepare',5,60);" > "/tmp/agentguard-rate-$i.json" &
          done
          wait
          rate_allowed=$(cat /tmp/agentguard-rate-*.json | jq -s '[.[] | select(.allowed == true)] | length')
          rate_denied=$(cat /tmp/agentguard-rate-*.json | jq -s '[.[] | select(.allowed == false)] | length')
          test "$rate_allowed" = "5"
          test "$rate_denied" = "5"
          echo "PASS: persistent rate limiter allows exactly five of ten concurrent requests across clients."

          # Critical state changes and their audit entries must roll back together.
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          CREATE OR REPLACE FUNCTION public.agentguard_test_fail_audit()
          RETURNS trigger LANGUAGE plpgsql AS $agentguard_test$
          BEGIN
            IF NEW.action IN ('agent_credential_created','transfer_finalized') THEN
              RAISE EXCEPTION 'forced_audit_failure';
            END IF;
            RETURN NEW;
          END
          $agentguard_test$;
          CREATE TRIGGER agentguard_test_fail_audit
          BEFORE INSERT ON public.agentguard_admin_audit
          FOR EACH ROW EXECUTE FUNCTION public.agentguard_test_fail_audit();
          DO $agentguard_test$
          BEGIN
            BEGIN
              PERFORM public.create_agent_with_audit('audit-fail-agent','Audit Fail Agent',repeat('a',64),'primary');
              RAISE EXCEPTION 'audit_failure_not_enforced';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM='audit_failure_not_enforced' THEN RAISE; END IF;
            END;
            IF EXISTS(SELECT 1 FROM public.agents WHERE id='audit-fail-agent')
               OR EXISTS(SELECT 1 FROM public.agent_policies WHERE agent_id='audit-fail-agent') THEN
              RAISE EXCEPTION 'agent_creation_survived_audit_failure';
            END IF;
          END
          $agentguard_test$;
          SQL
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('ag-audit-failure-finalise',1000000000000000000000,'agentguard-test.near','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('ag-audit-failure-finalise','primary');" | jq -e '.status == "reserved"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          DO $agentguard_test$
          BEGIN
            BEGIN
              PERFORM public.finish_agent_spend('ag-audit-failure-finalise','failed',NULL,'test');
              RAISE EXCEPTION 'audit_failure_not_enforced';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM='audit_failure_not_enforced' THEN RAISE; END IF;
            END;
            IF (SELECT status FROM public.spend_reservations WHERE request_id='ag-audit-failure-finalise')<>'reserved'
               OR (SELECT reserved_yocto FROM public.agent_budgets WHERE id='default')<>1000000000000000000000 THEN
              RAISE EXCEPTION 'settlement_survived_audit_failure';
            END IF;
          END
          $agentguard_test$;
          DROP TRIGGER agentguard_test_fail_audit ON public.agentguard_admin_audit;
          DROP FUNCTION public.agentguard_test_fail_audit();
          SQL
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('ag-audit-failure-finalise','failed',NULL,'test cleanup');" | jq -e '.status == "failed"' >/dev/null
          echo "PASS: agent creation and settlement roll back when audit insertion fails."
      - name: Run two simultaneous reservations
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          req_a="ag-concurrency-${suffix}-primary"
          req_b="ag-concurrency-${suffix}-research"
          amount="3000000000000000000000000"
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${req_a}', ${amount}, 'agentguard-test.near', 'primary');" > /tmp/agentguard-a.json &
          pid_a=$!
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${req_b}', ${amount}, 'agentguard-test.near', 'research-agent');" > /tmp/agentguard-b.json &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          cat /tmp/agentguard-a.json
          cat /tmp/agentguard-b.json
          created=$(cat /tmp/agentguard-a.json /tmp/agentguard-b.json | jq -s '[.[] | select(.created == true)] | length')
          blocked=$(cat /tmp/agentguard-a.json /tmp/agentguard-b.json | jq -s '[.[] | select(.status == "blocked")] | length')
          test "$created" = "1"
          test "$blocked" = "1"
          echo "PASS: exactly one concurrent request reserved 3 NEAR; the other was blocked."
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          DO \$\$
          DECLARE
            reserved numeric;
            spent numeric;
            rows_found integer;
          BEGIN
            SELECT reserved_yocto, spent_yocto INTO reserved, spent
            FROM public.agent_budgets WHERE id = 'default';
            SELECT count(*) INTO rows_found FROM public.spend_reservations
            WHERE request_id IN ('${req_a}', '${req_b}');
            IF reserved <> ${amount} OR spent <> 0 OR rows_found <> 1 THEN
              RAISE EXCEPTION 'ledger_or_budget_mismatch: reserved=%, spent=%, rows=%', reserved, spent, rows_found;
            END IF;
          END
          \$\$
          SQL
          winner=$(cat /tmp/agentguard-a.json /tmp/agentguard-b.json | jq -r 'select(.created == true) | .request_id')
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('${winner}', 'primary');" | jq -e '.status == "reserved"' >/dev/null
          export PGPASSWORD=service_role_test_only
          replay=$(psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${winner}', ${amount}, 'agentguard-test.near', CASE WHEN '${winner}' = '${req_a}' THEN 'primary' ELSE 'research-agent' END);")
          echo "$replay" | jq -e '.created == false' >/dev/null
          echo "PASS: identical request replay returned created=false."
          set +e
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${winner}', 4000000000000000000000000, 'agentguard-test.near', CASE WHEN '${winner}' = '${req_a}' THEN 'primary' ELSE 'research-agent' END);" >/tmp/agentguard-conflict.out 2>&1
          conflict_status=$?
          set -e
          test "$conflict_status" -ne 0
          grep -q "idempotency_key_conflict" /tmp/agentguard-conflict.out
          echo "PASS: same request ID with a changed amount was rejected."
          # Verify settlement accounting and terminal-state idempotency.
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${winner}', 'executed', 'mock-final-tx-hash', NULL);" | jq -e '.status == "executed"' >/dev/null
          echo "PASS: executed finalisation moves the reservation from reserved to spent."
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${winner}', 'failed', 'mock-final-tx-hash', NULL);" | jq -e '.status == "executed"' >/dev/null
          echo "PASS: terminal executed reservation cannot be changed by a later failed finalisation."
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          DO \$\$
          DECLARE reserved numeric; spent numeric; row_status text;
          BEGIN
            SELECT reserved_yocto, spent_yocto INTO reserved, spent FROM public.agent_budgets WHERE id = 'default';
            SELECT status INTO row_status FROM public.spend_reservations WHERE request_id = '${winner}';
            IF reserved <> 0 OR spent <> ${amount} OR row_status <> 'executed' THEN
              RAISE EXCEPTION 'executed_settlement_mismatch: reserved=%, spent=%, status=%', reserved, spent, row_status;
            END IF;
          END
          \$\$
          SQL
          req_failed="ag-concurrency-${suffix}-failed"
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${req_failed}', 1000000000000000000000000, 'agentguard-test.near', 'primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('${req_failed}', 'primary');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${req_failed}', 'failed', 'mock-failed-tx-hash', 'final_execution_failed');" | jq -e '.status == "failed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${req_failed}', 'executed', 'mock-failed-tx-hash', NULL);" | jq -e '.status == "failed"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          DO \$\$
          DECLARE reserved numeric; spent numeric; row_status text;
          BEGIN
            SELECT reserved_yocto, spent_yocto INTO reserved, spent FROM public.agent_budgets WHERE id = 'default';
            SELECT status INTO row_status FROM public.spend_reservations WHERE request_id = '${req_failed}';
            IF reserved <> 0 OR spent <> ${amount} OR row_status <> 'failed' THEN
              RAISE EXCEPTION 'failed_settlement_mismatch: reserved=%, spent=%, status=%', reserved, spent, row_status;
            END IF;
          END
          \$\$
          SQL
          echo "PASS: failed finalisation releases reserved budget without increasing spent."
          echo "PASS: terminal failed reservation cannot later become executed."
          echo "PASS: final ledger counters preserve the shared budget invariant."
          # Verify provider request ID and transaction hash are stored atomically.
          req_meta="ag-concurrency-${suffix}-provider-meta"
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${req_meta}', 1000000000000000000000000, 'agentguard-test.near', 'primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('${req_meta}', 'primary');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.record_outlayer_submission('${req_meta}', 'mock-provider-tx', 'mock-provider-request', 'awaiting_finality');" | jq -e '.status == "needs_review"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres -Atc "SELECT status || ':' || outlayer_tx_hash || ':' || outlayer_request_id FROM public.spend_reservations WHERE request_id = '${req_meta}';" | grep -qx 'needs_review:mock-provider-tx:mock-provider-request'
          echo "PASS: provider request ID and transaction hash are persisted atomically."
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${req_meta}', 'failed', 'mock-provider-tx', 'test_release');" | jq -e '.status == "failed"' >/dev/null
          echo "PASS: atomic provider metadata recording does not settle budget; normal finality RPC remains the settlement path."
          # Race two conflicting terminal outcomes against the same reservation.
          req_race="ag-concurrency-${suffix}-finish-race"
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${req_race}', 1000000000000000000000000, 'agentguard-test.near', 'primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('${req_race}', 'primary');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${req_race}', 'executed', 'mock-race-tx', NULL);" > /tmp/finish-executed.json &
          finish_a=$!
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${req_race}', 'failed', 'mock-race-tx', 'simulated_failure');" > /tmp/finish-failed.json &
          finish_b=$!
          wait "$finish_a"
          wait "$finish_b"
          cat /tmp/finish-executed.json /tmp/finish-failed.json
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          DO \$\$
          DECLARE reserved numeric; spent numeric; row_status text;
          BEGIN
            SELECT reserved_yocto, spent_yocto INTO reserved, spent FROM public.agent_budgets WHERE id = 'default';
            SELECT status INTO row_status FROM public.spend_reservations WHERE request_id = '${req_race}';
            IF reserved <> 0 OR row_status NOT IN ('executed', 'failed') THEN
              RAISE EXCEPTION 'concurrent_finish_status_invalid: reserved=%, spent=%, status=%', reserved, spent, row_status;
            END IF;
            IF (row_status = 'executed' AND spent <> 4000000000000000000000000)
               OR (row_status = 'failed' AND spent <> 3000000000000000000000000) THEN
              RAISE EXCEPTION 'concurrent_finish_accounting_mismatch: reserved=%, spent=%, status=%', reserved, spent, row_status;
            END IF;
          END
          \$\$
          SQL
          echo "PASS: concurrent conflicting finalisations produce one terminal outcome and consistent budget accounting."
          # Expired, never-approved requests may be cancelled and release their reservation.
          req_cancel="ag-concurrency-${suffix}-expired-cancel"
          cancel_amount=1000000000000000000000
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          INSERT INTO public.spend_reservations(request_id,amount_yocto,recipient,status,agent_id,approval_expires_at)
          VALUES ('${req_cancel}',${cancel_amount},'agentguard-test.near','awaiting_approval','primary',now()-interval '1 minute');
          UPDATE public.agent_budgets SET reserved_yocto=reserved_yocto+${cancel_amount} WHERE id='default';
          SQL
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.cancel_expired_agent_transfer('${req_cancel}','primary','Approval expired; no provider submission was made.');" | jq -e '.status == "cancelled"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres -Atc "SELECT status || ':' || cancelled_by FROM public.spend_reservations WHERE request_id='${req_cancel}';" | grep -qx 'cancelled:primary'
          echo "PASS: expired unapproved reservation is cancelled with actor and evidence audit."

          # A submitted transfer can be released only after the API verifies NEAR FINAL failure.
          req_resolve="ag-concurrency-${suffix}-failed-final-resolution"
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          INSERT INTO public.spend_reservations(request_id,amount_yocto,recipient,status,agent_id,outlayer_tx_hash)
          VALUES ('${req_resolve}',${cancel_amount},'agentguard-test.near','needs_review','primary','mock-final-failure-hash');
          UPDATE public.agent_budgets SET reserved_yocto=reserved_yocto+${cancel_amount} WHERE id='default';
          SQL
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.resolve_agent_transfer_failed_final('${req_resolve}','primary','NEAR reported final failure','https://nearblocks.io/txns/mock-final-failure-hash');" | jq -e '.status == "failed"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          DO \$\$
          DECLARE row_status text; actor text; reserved numeric; audit_count integer;
          BEGIN
            SELECT status,resolved_by INTO row_status,actor FROM public.spend_reservations WHERE request_id='${req_resolve}';
            SELECT reserved_yocto INTO reserved FROM public.agent_budgets WHERE id='default';
            SELECT count(*) INTO audit_count FROM public.agentguard_admin_audit
              WHERE target_id='${req_resolve}' AND action='transfer_resolved_failed_final';
