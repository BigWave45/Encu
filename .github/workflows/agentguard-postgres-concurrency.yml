          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${winner}', 'executed', 'mock-final-tx-hash', NULL);" | jq -e '.status == "executed"' >/dev/null
          echo "PASS: executed finalisation moves the reservation from reserved to spent."
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${winner}', 'failed', 'mock-final-tx-hash', NULL);" | jq -e '.status == "executed"' >/dev/null
          echo "PASS: terminal executed reservation cannot be changed by a later failed finalisation."
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          DO \$\$
          DECLARE reserved numeric; spent numeric; row_status text; winner_agent text; agent_reserved numeric; agent_spent numeric;
          BEGIN
            SELECT reserved_yocto, spent_yocto INTO reserved, spent FROM public.agent_budgets WHERE id = 'default';
            SELECT status,agent_id INTO row_status,winner_agent FROM public.spend_reservations WHERE request_id = '${winner}';
            SELECT reserved_yocto,spent_yocto INTO agent_reserved,agent_spent FROM public.agent_allocations WHERE agent_id=winner_agent;
            IF reserved <> 0 OR spent <> ${amount} OR row_status <> 'executed'
               OR agent_reserved<>0 OR agent_spent<>${amount} THEN
              RAISE EXCEPTION 'executed_settlement_mismatch: treasury_reserved=%, treasury_spent=%, status=%, agent=%, agent_reserved=%, agent_spent=%',
                reserved,spent,row_status,winner_agent,agent_reserved,agent_spent;
            END IF;
          END
          \$\$
          SQL
          req_failed="ag-concurrency-${suffix}-failed"
          export PGPASSWORD=agentguard_test_only
          primary_spent_before_failed=$(psql -v ON_ERROR_STOP=1 -U postgres -Atc "SELECT spent_yocto::text FROM public.agent_allocations WHERE agent_id='primary';")
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('${req_failed}', 1000000000000000000000000, 'agentguard-test.near', 'primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('${req_failed}', 'admin');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${req_failed}', 'failed', 'mock-failed-tx-hash', 'final_execution_failed');" | jq -e '.status == "failed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('${req_failed}', 'executed', 'mock-failed-tx-hash', NULL);" | jq -e '.status == "failed"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          DO \$\$
          DECLARE reserved numeric; spent numeric; row_status text; agent_reserved numeric; agent_spent numeric;
          BEGIN
            SELECT reserved_yocto, spent_yocto INTO reserved, spent FROM public.agent_budgets WHERE id = 'default';
            SELECT status INTO row_status FROM public.spend_reservations WHERE request_id = '${req_failed}';
            SELECT reserved_yocto,spent_yocto INTO agent_reserved,agent_spent FROM public.agent_allocations WHERE agent_id='primary';
            IF reserved <> 0 OR spent <> ${amount} OR row_status <> 'failed'
               OR agent_reserved<>0 OR agent_spent<>${primary_spent_before_failed}::numeric THEN
              RAISE EXCEPTION 'failed_settlement_mismatch: treasury_reserved=%, treasury_spent=%, status=%, agent_reserved=%, agent_spent=%, prior_agent_spent=%',
                reserved,spent,row_status,agent_reserved,agent_spent,${primary_spent_before_failed};
