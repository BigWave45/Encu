          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_allocation('research-agent',0,'admin');" >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_allocation('primary',5000000000000000000000000,'admin');" >/dev/null
          # Expired, never-approved requests may be cancelled and release their reservation.
