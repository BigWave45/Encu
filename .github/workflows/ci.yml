name: CI

on:
  push:
    branches:
      - main
      - agentguard/build-v1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-only
      OUTLAYER_BASE_URL: https://testnet-api.outlayer.ai
      OUTLAYER_API_KEY: ci-placeholder-only
      AGENTGUARD_AGENT_TOKEN: ci-placeholder-only
      AGENTGUARD_MAX_TRANSFER_YOCTO: "1000000000000000000000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
