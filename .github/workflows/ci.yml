name: CI

on:
  push:
    branches:
      - main
      - agentguard/build-v1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-only
      OUTLAYER_BASE_URL: https://testnet-api.outlayer.ai
      OUTLAYER_API_KEY: ci-placeholder-only
      OUTLAYER_NEAR_ADDRESS: agentguard.testnet
      AGENTGUARD_AGENT_TOKEN: ci-placeholder-only
      AGENTGUARD_MAX_TRANSFER_YOCTO: "1000000000000000000000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x === 'string' ? x : {title:x.title,url:x.url,range:x.range})})); console.log('TOTAL', JSON.stringify(a.metadata?.vulnerabilities || {}))"
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
