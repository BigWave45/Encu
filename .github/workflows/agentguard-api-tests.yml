name: AgentGuard API security and lifecycle tests

on:
  push:
    branches:
      - agentguard/build-v1
    paths:
      - ".github/workflows/agentguard-api-tests.yml"
      - "app/api/agent/transfer/route.ts"
      - "app/api/agent/reconcile/route.ts"
      - "app/api/agent/provider-status/route.ts"
      - "app/api/agent/balance/route.ts"
      - "lib/agent-rate-limit.ts"
      - "lib/rate-limit.ts"
      - "app/api/health/route.ts"
      - "lib/agent-auth.ts"
      - "lib/outlayer.ts"
      - "lib/supabase.ts"
      - "lib/security-audit.ts"
      - "app/page.tsx"
      - "app/api/admin/dashboard/route.ts"
      - "scripts/test-agent-api.mjs"
      - "scripts/test-reconciliation.mjs"
      - "supabase/setup.sql"
      - "supabase/reconcile-migration.sql"
      - "supabase/20261101090000_atomic_outlayer_submission.sql"
      - "supabase/20261101120000_admin_dashboard_controls.sql"
      - "supabase/20261101140000_security_event_log.sql"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
          OUTLAYER_BASE_URL: https://example.invalid
          OUTLAYER_API_KEY: build-only-placeholder
          OUTLAYER_NEAR_ADDRESS: agentguard.testnet
          AGENTGUARD_MAX_TRANSFER_YOCTO: "5000000000000000000000000"
        run: npm run build
      - name: Run API security and transfer lifecycle tests
        run: npm run test:agent-api
      - name: Run NEAR finality reconciliation tests
        run: npm run test:reconciliation
