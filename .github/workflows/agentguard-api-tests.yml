name: AgentGuard API security and lifecycle tests

on:
  push:
    branches:
      - agentguard/build-v1
    paths:
      - ".github/workflows/agentguard-api-tests.yml"
      - "app/api/agent/transfer/route.ts"
      - "lib/agent-auth.ts"
      - "lib/outlayer.ts"
      - "lib/supabase.ts"
      - "scripts/test-agent-api.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
          OUTLAYER_BASE_URL: https://example.invalid
          OUTLAYER_API_KEY: build-only-placeholder
          AGENTGUARD_MAX_TRANSFER_YOCTO: "5000000000000000000000000"
        run: npm run build
      - name: Run API security and transfer lifecycle tests
        run: npm run test:agent-api
