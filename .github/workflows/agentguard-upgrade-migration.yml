name: AgentGuard upgrade migration test

on:
  push:
    branches:
      - agentguard/build-v1
    paths:
      - ".github/workflows/agentguard-upgrade-migration.yml"
      - "supabase/multi-agent-v1-migration.sql"
      - "supabase/outlayer-request-id-migration.sql"
      - "supabase/reconcile-migration.sql"
      - "supabase/multi-agent-v1-cleanup.sql"
      - "supabase/20261101120000_admin_dashboard_controls.sql"
      - "supabase/20261101140000_security_event_log.sql"
      - "supabase/20261031221500_restrict_privileged_rpc_access.sql"
      - "supabase/20261101090000_atomic_outlayer_submission.sql"
      - "supabase/20261101190000_agentguard_v1_security_controls.sql"
      - "supabase/20261101230000_submission_audit_and_append_only.sql"
      - "supabase/20261102080000_admin_actor_self_approval_guard.sql"
      - "supabase/20261102090000_reserve_admin_agent_id.sql"
      - "supabase/20261102100000_revoke_public_core_table_access.sql"
      - "supabase/20261102110000_grant_service_role_core_reads.sql"
      - "supabase/20261103000000_treasury_agent_allocations.sql"
      - "supabase/20261103010000_enforce_agent_allocations.sql"
      - "supabase/20261103020000_agent_recipient_registry.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-existing-database:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agentguard_test_only
          POSTGRES_DB: agentguard_upgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentguard_upgrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: agentguard_upgrade_test
      PGUSER: postgres
      PGPASSWORD: agentguard_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
      - name: Build the pre-V1 database baseline
        run: |
          set -euo pipefail
          base_sha="534094096eead5f7e9ecbf4d48c485f2c6eae685"
          git fetch --no-tags origin "$base_sha"
          git show "$base_sha:supabase/setup.sql" > /tmp/pre-v1-setup.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role LOGIN PASSWORD 'service_role_test_only';
          SQL
          psql -v ON_ERROR_STOP=1 -f /tmp/pre-v1-setup.sql
          psql -v ON_ERROR_STOP=1 -Atc "SELECT public.reserve_agent_spend('migration-legacy-0001',1000000000000000000000000,'legacy.testnet');" | jq -e '.created == true and .status == "reserved"' >/dev/null
      - name: Apply documented upgrade sequence
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/multi-agent-v1-migration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/outlayer-request-id-migration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/reconcile-migration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/multi-agent-v1-cleanup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101120000_admin_dashboard_controls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101140000_security_event_log.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261031221500_restrict_privileged_rpc_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101090000_atomic_outlayer_submission.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101190000_agentguard_v1_security_controls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261101230000_submission_audit_and_append_only.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261102080000_admin_actor_self_approval_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261102090000_reserve_admin_agent_id.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261102100000_revoke_public_core_table_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261102110000_grant_service_role_core_reads.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261103000000_treasury_agent_allocations.sql
          # Simulate an old application instance reserving between the additive
          # schema migration and the enforcement migration.
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agentguard_transfers_enabled(true,'admin');" >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('migration-phase-gap-0001',250000000000000000000000,'recipient.testnet','primary');" | jq -e '.created == true' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -f supabase/20261103010000_enforce_agent_allocations.sql
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.agent_policies SET allowed_recipients=ARRAY['legacy.testnet','recipient.testnet'] WHERE agent_id='primary';"
          psql -v ON_ERROR_STOP=1 -f supabase/20261103020000_agent_recipient_registry.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $reserved_admin$
          BEGIN
            BEGIN
              INSERT INTO public.agents(id,name,token_hash,active)
              VALUES ('admin','Reserved administrator identity',repeat('f',64),true);
              RAISE EXCEPTION 'reserved_admin_agent_id_was_accepted';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.agents'::regclass
                AND conname='agents_reserved_admin_id_check'
            ) THEN
              RAISE EXCEPTION 'reserved_admin_agent_id_constraint_missing';
            END IF;
          END
          $reserved_admin$;
          SQL
      - name: Verify preserved data, schema, permissions and transfer lifecycle
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $allocation_backfill$
          DECLARE
            v_limit numeric;
            v_spent numeric;
            v_reserved numeric;
          BEGIN
            SELECT allocation_limit_yocto,spent_yocto,reserved_yocto
              INTO v_limit,v_spent,v_reserved
              FROM public.agent_allocations WHERE agent_id='primary';
            IF v_limit<>1250000000000000000000000
               OR v_spent<>0
               OR v_reserved<>1250000000000000000000000 THEN
              RAISE EXCEPTION 'allocation_backfill_mismatch: limit=%, spent=%, reserved=%',
                v_limit,v_spent,v_reserved;
            END IF;
            IF (SELECT count(*) FROM public.agent_allocations)<>1 THEN
              RAISE EXCEPTION 'unexpected_allocation_rows_after_legacy_backfill';
            END IF;
            IF has_table_privilege('anon','public.agent_allocations','SELECT')
               OR has_table_privilege('authenticated','public.agent_allocations','SELECT')
               OR NOT has_table_privilege('service_role','public.agent_allocations','SELECT') THEN
              RAISE EXCEPTION 'agent_allocation_table_grants_invalid';
            END IF;
          END
          $allocation_backfill$;
          DO $recipient_backfill$
          BEGIN
            IF (SELECT count(*) FROM public.agent_authorized_recipients WHERE agent_id='primary')<>2
               OR NOT EXISTS (SELECT 1 FROM public.agent_authorized_recipients WHERE agent_id='primary' AND account_id='legacy.testnet' AND status='active')
               OR NOT EXISTS (SELECT 1 FROM public.agent_authorized_recipients WHERE agent_id='primary' AND account_id='recipient.testnet' AND status='active') THEN
              RAISE EXCEPTION 'explicit_legacy_recipient_allowlist_not_backfilled';
            END IF;
            IF has_table_privilege('anon','public.agent_authorized_recipients','SELECT')
               OR has_table_privilege('authenticated','public.agent_authorized_recipients','SELECT')
               OR NOT has_table_privilege('service_role','public.agent_authorized_recipients','SELECT') THEN
              RAISE EXCEPTION 'recipient_registry_table_grants_invalid';
            END IF;
          END
          $recipient_backfill$;
          DO $legacy_preservation$
          DECLARE
            v_agent_id text;
            v_status text;
            v_reserved numeric;
          BEGIN
            SELECT agent_id,status INTO v_agent_id,v_status
              FROM public.spend_reservations WHERE request_id='migration-legacy-0001';
            SELECT reserved_yocto INTO v_reserved FROM public.agent_budgets WHERE id='default';
            IF v_agent_id<>'primary' OR v_status<>'reserved'
               OR v_reserved<>1250000000000000000000000 THEN
              RAISE EXCEPTION 'legacy_data_not_preserved: agent=%, status=%, reserved=%',
                v_agent_id,v_status,v_reserved;
            END IF;
            IF to_regclass('public.agentguard_admin_audit') IS NULL
               OR to_regclass('public.agentguard_security_events') IS NULL
               OR to_regclass('public.agent_policies') IS NULL
               OR to_regclass('public.agentguard_system_controls') IS NULL
               OR to_regclass('public.agentguard_rate_windows') IS NULL THEN
              RAISE EXCEPTION 'required_v1_tables_missing';
            END IF;
            IF to_regprocedure('public.reserve_agent_spend(text,numeric,text)') IS NOT NULL
               OR to_regprocedure('public.reserve_agent_spend(text,numeric,text,text)') IS NULL
               OR to_regprocedure('public.record_outlayer_submission(text,text,text,text)') IS NULL THEN
              RAISE EXCEPTION 'required_rpc_signature_missing_or_legacy_rpc_remains';
            END IF;
            IF NOT has_function_privilege('service_role',
                 'public.reserve_agent_spend(text,numeric,text,text)','EXECUTE')
               OR has_function_privilege('anon',
                 'public.reserve_agent_spend(text,numeric,text,text)','EXECUTE')
               OR has_function_privilege('authenticated',
                 'public.reserve_agent_spend(text,numeric,text,text)','EXECUTE') THEN
              RAISE EXCEPTION 'privileged_rpc_grants_invalid';
            END IF;
            IF has_table_privilege('service_role','public.agentguard_admin_audit','UPDATE')
               OR has_table_privilege('service_role','public.agentguard_admin_audit','DELETE')
               OR has_table_privilege('service_role','public.agentguard_admin_audit','TRUNCATE')
               OR has_table_privilege('service_role','public.agentguard_security_events','UPDATE')
               OR has_table_privilege('service_role','public.agentguard_security_events','DELETE')
               OR has_table_privilege('service_role','public.agentguard_security_events','TRUNCATE')
               OR NOT has_table_privilege('service_role','public.agentguard_admin_audit','INSERT')
               OR NOT has_table_privilege('service_role','public.agentguard_admin_audit','SELECT')
               OR NOT has_table_privilege('service_role','public.agentguard_security_events','INSERT')
               OR NOT has_table_privilege('service_role','public.agentguard_security_events','SELECT') THEN
              RAISE EXCEPTION 'append_only_audit_grants_invalid';
            END IF;
            IF pg_get_functiondef('public.record_outlayer_submission(text,text,text,text)'::regprocedure)
               NOT LIKE '%provider_submission_recorded%' THEN
              RAISE EXCEPTION 'submission_audit_correction_not_applied';
            END IF;
            IF has_table_privilege('anon','public.agents','SELECT')
               OR has_table_privilege('authenticated','public.agents','SELECT')
               OR has_table_privilege('anon','public.agent_budgets','SELECT')
               OR has_table_privilege('authenticated','public.agent_budgets','SELECT')
               OR has_table_privilege('anon','public.spend_reservations','SELECT')
               OR has_table_privilege('authenticated','public.spend_reservations','SELECT')
               OR NOT has_table_privilege('service_role','public.agents','SELECT')
               OR NOT has_table_privilege('service_role','public.agent_budgets','SELECT')
               OR NOT has_table_privilege('service_role','public.spend_reservations','SELECT') THEN
              RAISE EXCEPTION 'core_table_grants_invalid';
            END IF;
          END
          $legacy_preservation$;
          SQL
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reject_agent_transfer('migration-phase-gap-0001','admin','allocation migration gap cleanup');" | jq -e '.status == "rejected"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_allocation('primary',2000000000000000000000000,'admin');" | jq -e '.allocation_limit_yocto == "2000000000000000000000000"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agentguard_transfers_enabled(true,'primary');" | jq -e '.transfers_enabled == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.create_agent_with_audit('allocation-zero','Zero Allocation',repeat('a',64),'admin');" | jq -e '.allocation_limit_yocto == "0"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT count(*) FROM public.agent_authorized_recipients WHERE agent_id='allocation-zero';" | grep -qx '0'
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('allocation-zero-denied',1000000000000000000000,'recipient.testnet','allocation-zero');" | jq -e '.created == false and .reason == "agent_allocation_exceeded"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('migration-v1-lifecycle-0001',1000000000000000000000000,'recipient.testnet','primary');" | jq -e '.created == true and .status == "awaiting_approval"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('allocation-over-limit',1000000000000000000000,'recipient.testnet','primary');" | jq -e '.created == false and .reason == "agent_allocation_exceeded"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('unlisted-recipient-0001',1000000000000000000000,'unlisted.testnet','primary');" | jq -e '.created == false and .reason == "recipient_not_authorized"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role <<'SQL'
          DO $self_approval$
          BEGIN
            BEGIN
              PERFORM public.approve_agent_transfer('migration-v1-lifecycle-0001','primary');
              RAISE EXCEPTION 'self_approval_was_not_rejected';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM <> 'self_approval_forbidden' THEN RAISE; END IF;
            END;
          END
          $self_approval$;
          SQL
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('migration-v1-lifecycle-0001','admin');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.record_outlayer_submission('migration-v1-lifecycle-0001','mock-tx-hash','mock-provider-request',NULL);" | jq -e '.status == "needs_review"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.record_outlayer_submission('migration-v1-lifecycle-0001','mock-tx-hash','mock-provider-request',NULL);" | jq -e '.status == "needs_review"' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM public.agentguard_admin_audit WHERE target_id='migration-v1-lifecycle-0001' AND action='provider_submission_recorded';" | grep -qx '1'
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('migration-v1-lifecycle-0001','executed','mock-tx-hash',NULL);" | jq -e '.status == "executed"' >/dev/null
          echo "CHECK: finality audit is written immediately on successful settlement"
          psql -Atc "SELECT count(*) FROM public.agentguard_admin_audit WHERE target_id='migration-v1-lifecycle-0001' AND action='transfer_finalized'" | grep -qx '1'
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('migration-legacy-0001','executed','mock-legacy-tx-hash',NULL);" | jq -e '.status == "executed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('migration-legacy-0001','executed','mock-legacy-tx-hash',NULL);" | jq -e '.status == "executed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.set_agent_allocation('primary',3000000000000000000000000,'admin');" | jq -e '.allocation_limit_yocto == "3000000000000000000000000"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.authorize_agent_recipient('primary','revoked.testnet','revocation test',NULL,'admin');" | jq -e '.status == "active"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('recipient-revocation-pending-001',500000000000000000000000,'revoked.testnet','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.revoke_agent_recipient('primary','revoked.testnet','test revocation','admin');" | jq -e '.status == "revoked" and .pending_approvals == 1' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role <<'SQL'
          DO $recipient_revocation$
          BEGIN
            BEGIN
              PERFORM public.approve_agent_transfer('recipient-revocation-pending-001','admin');
              RAISE EXCEPTION 'revoked_recipient_approval_was_accepted';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM<>'recipient_not_authorized' THEN RAISE; END IF;
            END;
          END
          $recipient_revocation$;
          SQL
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reject_agent_transfer('recipient-revocation-pending-001','admin','revoked recipient test');" | jq -e '.status == "rejected"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.authorize_agent_recipient('primary','claimed.testnet','claimed submission test',NULL,'admin');" | jq -e '.status == "active"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('recipient-claimed-inflight-001',500000000000000000000000,'claimed.testnet','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('recipient-claimed-inflight-001','admin');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.revoke_agent_recipient('primary','claimed.testnet','claimed submission revoke','admin');" | jq -e '.claimed_inflight == 1 and .provider_submitted == 0' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('recipient-claimed-inflight-001','failed',NULL,'mock claimed request cleanup');" | jq -e '.status == "failed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.authorize_agent_recipient('primary','revoked.testnet','reactivated recipient',NULL,'admin');" | jq -e '.status == "active"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('recipient-reactivated-001',500000000000000000000000,'revoked.testnet','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reject_agent_transfer('recipient-reactivated-001','admin','release reactivated recipient test');" | jq -e '.status == "rejected"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role <<'SQL'
          DO $recipient_expiry$
          BEGIN
            BEGIN
              PERFORM public.authorize_agent_recipient('primary','expired.testnet','expired',now()-interval '1 minute','admin');
              RAISE EXCEPTION 'past_expiry_was_accepted';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM<>'invalid_recipient_authorization' THEN RAISE; END IF;
            END;
          END
          $recipient_expiry$;
          SQL
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('migration-reject-0001',500000000000000000000000,'recipient.testnet','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reject_agent_transfer('migration-reject-0001','admin','test rejection');" | jq -e '.status == "rejected"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('migration-cancel-0001',500000000000000000000000,'recipient.testnet','primary');" | jq -e '.created == true' >/dev/null
          export PGPASSWORD=agentguard_test_only
          psql -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE public.spend_reservations
          SET approval_expires_at=now()-interval '1 minute'
          WHERE request_id='migration-cancel-0001';
          SQL
          export PGPASSWORD=service_role_test_only
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.cancel_expired_agent_transfer('migration-cancel-0001','admin','expired test request');" | jq -e '.status == "cancelled"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('migration-failed-0001',500000000000000000000000,'recipient.testnet','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('migration-failed-0001','admin');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.finish_agent_spend('migration-failed-0001','failed',NULL,'verified failure test');" | jq -e '.status == "failed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.reserve_agent_spend('migration-failed-final-0001',500000000000000000000000,'recipient.testnet','primary');" | jq -e '.created == true' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.approve_agent_transfer('migration-failed-final-0001','admin');" | jq -e '.status == "reserved"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.record_outlayer_submission('migration-failed-final-0001','mock-failed-final-hash','mock-failed-provider-request',NULL);" | jq -e '.status == "needs_review"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role -Atc "SELECT public.resolve_agent_transfer_failed_final('migration-failed-final-0001','admin','NEAR FINAL failure test','near-final:mock-failed-final-hash');" | jq -e '.status == "failed"' >/dev/null
          psql -v ON_ERROR_STOP=1 -U service_role <<'SQL'
          DO $allocation_guards$
          BEGIN
            BEGIN
              PERFORM public.set_agent_allocation('primary',1500000000000000000000000,'admin');
              RAISE EXCEPTION 'allocation_floor_not_enforced';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM<>'allocation_below_committed_amounts' THEN RAISE; END IF;
            END;
            BEGIN
              PERFORM public.set_agent_allocation('primary',6000000000000000000000000,'admin');
              RAISE EXCEPTION 'treasury_allocation_ceiling_not_enforced';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM<>'allocations_exceed_treasury_limit' THEN RAISE; END IF;
            END;
            BEGIN
              PERFORM public.update_agent_budget_limit(2000000000000000000000000,'admin');
              RAISE EXCEPTION 'treasury_below_allocations_not_rejected';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM<>'budget_below_allocated_amounts' THEN RAISE; END IF;
            END;
          END
          $allocation_guards$;
          SQL
          export PGPASSWORD=agentguard_test_only
          psql -Atc "SELECT jsonb_build_object('budget',(SELECT jsonb_build_object('limit',total_limit_yocto::text,'spent',spent_yocto::text,'reserved',reserved_yocto::text) FROM public.agent_budgets WHERE id='default'),'allocations',(SELECT jsonb_agg(jsonb_build_object('agent_id',agent_id,'limit',allocation_limit_yocto::text,'spent',spent_yocto::text,'reserved',reserved_yocto::text)) FROM public.agent_allocations),'lifecycle_audit_count',(SELECT count(*) FROM public.agentguard_admin_audit WHERE target_id='migration-v1-lifecycle-0001' AND action IN ('transfer_approved','provider_submission_recorded','transfer_finalized')));"
          echo "CHECK: treasury and agent reserved counters match"
          psql -Atc "SELECT CASE WHEN b.reserved_yocto=(SELECT coalesce(sum(reserved_yocto),0) FROM public.agent_allocations) THEN 'PASS' ELSE 'FAIL' END FROM public.agent_budgets b WHERE id='default'" | grep -qx 'PASS'
          echo "CHECK: treasury and agent spent counters match"
